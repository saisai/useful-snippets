# Redirect HTTP to HTTPS (uncomment when SSL is ready)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name example.com www.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Maximum upload size
    client_max_body_size 16M;

    # Access and Error Logs
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;

    location / {
        proxy_pass http://unix:/home/user/test/test.sock;
        
        # Preserve original request metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve static assets directly via Nginx (bypasses Python for speed)
    location /static/ {
        alias /home/user/test/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
