services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: useful-snippets-kb:dev
    container_name: useful-snippets-kb-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- -p 3000 --hostname 0.0.0.0
