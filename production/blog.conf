# Host nginx site config for the knowledge base.
#
# Install:
#   sudo cp production/blog.conf /etc/nginx/sites-available/blog.conf
#   sudo ln -sf /etc/nginx/sites-available/blog.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires the app container to be running:
#   docker compose -f production/docker-compose.yml up -d --build

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream blog_frontend {
    # Must match production/docker-compose.yml ports: "127.0.0.1:3001:3000"
    server 127.0.0.1:3001;
    keepalive 32;
}

# Redirect HTTP to HTTPS (enable after TLS certificates exist)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name blog.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    client_max_body_size 20M;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    # Uncomment after installing TLS certificates (Let's Encrypt / certbot)
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /_next/static/ {
        proxy_pass http://blog_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://blog_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
