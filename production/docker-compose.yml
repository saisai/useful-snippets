services:
  blog:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    image: useful-snippets-kb:prod
    container_name: useful-snippets-kb-blog
    restart: unless-stopped
    # Host nginx in blog.conf connects to 127.0.0.1:3001 — bind locally only.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: https://blog.example.com
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
