# Production deploy — image comes from Docker Hub only.
#
# Deploy:
#   docker compose --env-file .env_hub pull
#   docker compose --env-file .env_hub up -d
#
# Configure image name and site URL in .env_hub (see .env_hub.example).

services:
  blog:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE in .env_hub}
    pull_policy: always
    container_name: useful-snippets-kb-blog
    restart: unless-stopped
    # Host nginx in blog.conf connects to 127.0.0.1:3001 — bind locally only.
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env_hub
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
